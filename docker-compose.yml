services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: piano_academie
      POSTGRES_USER: piano
      POSTGRES_PASSWORD: piano
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      JWT_SECRET_KEY: dev-secret-change-me
      JWT_ALGORITHM: HS256
      INVOICE_DOWNLOAD_SECRET: ${INVOICE_DOWNLOAD_SECRET:-dev-invoice-download-secret-change-me}
      GIFT_CARD_CODE_PEPPER: ${GIFT_CARD_CODE_PEPPER:-}
      TYPEFORM_WEBHOOK_SECRET: ${TYPEFORM_WEBHOOK_SECRET:-}
      BREVO_WEBHOOK_SECRET: ${BREVO_WEBHOOK_SECRET:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${CLIENT_ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      CLIENT_ACCESS_TOKEN_EXPIRE_MINUTES: ${CLIENT_ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      PROFESSOR_ACCESS_TOKEN_EXPIRE_MINUTES: ${PROFESSOR_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES: ${ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      REFRESH_SESSION_EXPIRE_DAYS: ${REFRESH_SESSION_EXPIRE_DAYS:-30}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-LOG}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@piano-academie.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_CLIENT_BUNDLE_ID: ${APNS_CLIENT_BUNDLE_ID:-com.pianoacademie.client}
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      ZENDESK_SUBDOMAIN: ${ZENDESK_SUBDOMAIN:-}
      ZENDESK_ADMIN_EMAIL: ${ZENDESK_ADMIN_EMAIL:-}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:-}
      ZENDESK_SYNC_INTERVAL_MINUTES: ${ZENDESK_SYNC_INTERVAL_MINUTES:-15}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - catalog_product_images:/app/uploads/catalog-products
      - legacy_invoice_documents:/app/uploads/legacy-invoices
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request as r; data=json.load(r.urlopen('http://localhost:8000/health')); sys.exit(0 if data.get('ok') else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-30000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES: ${ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  notifications-immediate-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-LOG}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@piano-academie.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
    command: ["python", "scripts/worker_immediate_notifications.py"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifications-scheduled-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-LOG}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@piano-academie.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      ZENDESK_SUBDOMAIN: ${ZENDESK_SUBDOMAIN:-}
      ZENDESK_ADMIN_EMAIL: ${ZENDESK_ADMIN_EMAIL:-}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:-}
      ZENDESK_SYNC_INTERVAL_MINUTES: ${ZENDESK_SYNC_INTERVAL_MINUTES:-15}
    command: ["python", "scripts/worker_scheduled_notifications.py"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifications-feedback-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "scripts/worker_delivery_feedback.py"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  catalog_product_images:
  legacy_invoice_documents:
