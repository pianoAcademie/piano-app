services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piano_academie
      POSTGRES_USER: piano
      POSTGRES_PASSWORD: piano
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      JWT_SECRET_KEY: dev-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES: ${ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-LOG}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@piano-academie.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - catalog_product_images:/app/uploads/catalog-products
      - legacy_invoice_documents:/app/uploads/legacy-invoices
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request as r; data=json.load(r.urlopen('http://localhost:8000/health')); sys.exit(0 if data.get('ok') else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-30000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES: ${ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  notifications-immediate-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-LOG}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@piano-academie.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
    command: ["python", "scripts/worker_immediate_notifications.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifications-scheduled-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-LOG}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@piano-academie.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SUBJECT_PREFIX: ${EMAIL_SUBJECT_PREFIX:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
    command: ["python", "scripts/worker_scheduled_notifications.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifications-feedback-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["python", "scripts/worker_delivery_feedback.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  catalog_product_images:
  legacy_invoice_documents:
