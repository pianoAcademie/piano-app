services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piano_academie
      POSTGRES_USER: piano
      POSTGRES_PASSWORD: piano
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://piano:piano@db:5432/piano_academie
      JWT_SECRET_KEY: dev-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      LOG_LEVEL: INFO
      LOG_JSON: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request as r; data=json.load(r.urlopen('http://localhost:8000/health')); sys.exit(0 if data.get('ok') else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      BACKEND_TIMEOUT_MS: "10000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
