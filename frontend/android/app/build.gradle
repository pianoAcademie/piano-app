apply plugin: 'com.android.application'

def clientKeystorePath = System.getenv("PA_CLIENT_KEYSTORE_PATH")
def clientKeystorePassword = System.getenv("PA_CLIENT_KEYSTORE_PASSWORD")
def clientKeyAlias = System.getenv("PA_CLIENT_KEY_ALIAS")
def clientKeyPassword = System.getenv("PA_CLIENT_KEY_PASSWORD")
def hasClientReleaseSigning = clientKeystorePath && clientKeystorePassword && clientKeyAlias && clientKeyPassword

def professorKeystorePath = System.getenv("PA_PROF_KEYSTORE_PATH")
def professorKeystorePassword = System.getenv("PA_PROF_KEYSTORE_PASSWORD")
def professorKeyAlias = System.getenv("PA_PROF_KEY_ALIAS")
def professorKeyPassword = System.getenv("PA_PROF_KEY_PASSWORD")
def hasProfessorReleaseSigning = professorKeystorePath && professorKeystorePassword && professorKeyAlias && professorKeyPassword

android {
    namespace "com.pianoacademie.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasClientReleaseSigning) {
            clientRelease {
                storeFile file(clientKeystorePath)
                storePassword clientKeystorePassword
                keyAlias clientKeyAlias
                keyPassword clientKeyPassword
            }
        }
        if (hasProfessorReleaseSigning) {
            professorRelease {
                storeFile file(professorKeystorePath)
                storePassword professorKeystorePassword
                keyAlias professorKeyAlias
                keyPassword professorKeyPassword
            }
        }
    }
    flavorDimensions += "portal"
    productFlavors {
        client {
            dimension "portal"
            applicationId "com.pianoacademie.client"
            versionCode Integer.parseInt(System.getenv("PA_CLIENT_VERSION_CODE") ?: "1")
            versionName System.getenv("PA_CLIENT_VERSION_NAME") ?: "1.0"
            resValue "string", "app_name", "Piano Academie Client"
            resValue "string", "title_activity_main", "Piano Academie Client"
            resValue "string", "package_name", "com.pianoacademie.client"
            resValue "string", "custom_url_scheme", "com.pianoacademie.client"
            if (hasClientReleaseSigning) {
                signingConfig signingConfigs.clientRelease
            }
        }
        professeur {
            dimension "portal"
            applicationId "com.pianoacademie.professeur"
            versionCode Integer.parseInt(System.getenv("PA_PROF_VERSION_CODE") ?: "1")
            versionName System.getenv("PA_PROF_VERSION_NAME") ?: "1.0.0"
            resValue "string", "app_name", "Piano Academie Professeur"
            resValue "string", "title_activity_main", "Piano Academie Professeur"
            resValue "string", "package_name", "com.pianoacademie.professeur"
            resValue "string", "custom_url_scheme", "com.pianoacademie.professeur"
            if (hasProfessorReleaseSigning) {
                signingConfig signingConfigs.professorRelease
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
