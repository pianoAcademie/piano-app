name: Repair Prod Quote Planning Audit 2026-2027

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to true to align the 19 reviewed quote/student records. false is a dry-run."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "${VPS_USER}" || { echo "Missing secret VPS_USER"; exit 1; }
          test -n "${VPS_PATH}" || { echo "Missing secret VPS_PATH"; exit 1; }
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing SSH key secret"
            exit 1
          fi

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY_CONTENT="${{ secrets.VPS_SSH_KEY }}"
          if [ -z "${SSH_KEY_CONTENT}" ]; then
            SSH_KEY_CONTENT="${{ secrets.SSH_PRIVATE_KEY }}"
          fi
          printf '%s\n' "${SSH_KEY_CONTENT}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${VPS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${VPS_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts || { echo "known_hosts is empty"; exit 1; }

      - name: Dry-run reviewed production repair
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'
            export COMPOSE_PROJECT_NAME='piano-app'
            docker compose exec -T backend python scripts/repair_prod_quote_planning_audit_2026_2027.py
          "

      - name: Apply reviewed production repair
        if: ${{ inputs.apply == 'true' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'
            export COMPOSE_PROJECT_NAME='piano-app'
            docker compose exec -T backend python scripts/repair_prod_quote_planning_audit_2026_2027.py --apply
          "
