name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Alembic revision chain
        run: python3 backend/scripts/check_alembic_chain.py

      - name: Validate required secrets
        run: |
          set -euo pipefail
          echo "Validating deploy secrets..."
          test -n "${VPS_HOST}" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "${VPS_USER}" || { echo "Missing secret VPS_USER"; exit 1; }
          test -n "${VPS_PATH}" || { echo "Missing secret VPS_PATH"; exit 1; }
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing SSH key secret: set VPS_SSH_KEY (preferred) or SSH_PRIVATE_KEY"
            exit 1
          fi
          if [ -n "${VPS_PORT:-}" ]; then
            echo "${VPS_PORT}" | grep -Eq '^[0-9]+$' || { echo "Invalid VPS_PORT secret (must be numeric, e.g. 22)"; exit 1; }
          fi
          echo "${VPS_HOST}" | grep -Eq '[<>]' && { echo "Invalid VPS_HOST secret (placeholder detected)"; exit 1; }
          echo "${VPS_USER}" | grep -Eq '[<>]' && { echo "Invalid VPS_USER secret (placeholder detected)"; exit 1; }
          echo "${VPS_PATH}" | grep -Eq '[<>]' && { echo "Invalid VPS_PATH secret (placeholder detected)"; exit 1; }
          echo "[OK] Secrets look valid"

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY_CONTENT="${{ secrets.VPS_SSH_KEY }}"
          if [ -z "${SSH_KEY_CONTENT}" ]; then
            SSH_KEY_CONTENT="${{ secrets.SSH_PRIVATE_KEY }}"
          fi
          printf '%s\n' "${SSH_KEY_CONTENT}" | tr -d '\r' > ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519 || { echo "SSH key file is empty"; exit 1; }
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          # Always refresh host fingerprint to avoid stale known_hosts mismatches.
          ssh-keygen -R "${VPS_HOST}" >/dev/null 2>&1 || true
          ssh-keygen -R "[${VPS_HOST}]:${VPS_PORT:-22}" >/dev/null 2>&1 || true
          if ! ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Warning: ssh-keyscan failed for ${VPS_HOST}:${VPS_PORT:-22}"
          fi
          if [ -n "${VPS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${VPS_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts || {
            echo "known_hosts is empty. Configure VPS_KNOWN_HOSTS secret or ensure ssh-keyscan reaches the host.";
            exit 1;
          }
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "mkdir -p '${VPS_PATH}'"

      - name: SSH preflight check
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "echo '[OK] SSH connected to' \$(hostname) && docker --version && docker compose version"

      - name: Sync project to VPS
        run: |
          set -euo pipefail
          rsync -az \
            --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "backend/.venv" \
            --exclude "backend/__pycache__" \
            --exclude "frontend/.next" \
            --exclude "frontend/node_modules" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${VPS_PORT:-22}" \
            ./ "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/"

      - name: Deploy on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'
            services=\$(docker compose config --services)

            if echo \"\$services\" | grep -qx redis; then
              docker compose up -d --build db redis
            else
              docker compose up -d --build db
            fi

            docker compose run --rm -T --build backend alembic upgrade head

            up_targets='backend frontend'
            for svc in notifications-immediate-worker notifications-scheduled-worker notifications-feedback-worker; do
              if echo \"\$services\" | grep -qx \"\$svc\"; then
                up_targets=\"\$up_targets \$svc\"
              fi
            done

            docker compose up -d --build \$up_targets
            docker compose ps
          "

      - name: Healthchecks on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'

            for i in \$(seq 1 60); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -sf http://127.0.0.1:8000/health

            for i in \$(seq 1 60); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
              if [ \"\$code\" = \"200\" ]; then
                break
              fi
              sleep 2
            done
            code=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ \"\$code\" = \"200\" ] || { echo \"Frontend healthcheck failed: \$code\"; exit 1; }

            services=\$(docker compose config --services)
            for svc in notifications-immediate-worker notifications-scheduled-worker notifications-feedback-worker; do
              if ! echo \"\$services\" | grep -qx \"\$svc\"; then
                echo \"Skip optional service check: \$svc (not defined)\"
                continue
              fi
              running=\$(docker compose ps --services --status running | grep -x \"\$svc\" || true)
              [ -n \"\$running\" ] || { echo \"Service not running: \$svc\"; docker compose ps \"\$svc\"; exit 1; }
            done
          "

      - name: Dump remote logs on failure
        if: failure()
        run: |
          set -euo pipefail
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            echo "Skip remote log dump: SSH key file missing (failure happened before Setup SSH)."
            exit 0
          fi
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set +e
            cd '${VPS_PATH}'
            docker compose ps
            docker compose logs --tail=200 backend
            docker compose logs --tail=120 frontend
            docker compose logs --tail=120 db
            services=\$(docker compose config --services)
            for svc in redis notifications-immediate-worker notifications-scheduled-worker notifications-feedback-worker; do
              if echo \"\$services\" | grep -qx \"\$svc\"; then
                docker compose logs --tail=120 \"\$svc\"
              fi
            done
          "
