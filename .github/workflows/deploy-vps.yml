name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "${VPS_USER}" || { echo "Missing secret VPS_USER"; exit 1; }
          test -n "${VPS_PATH}" || { echo "Missing secret VPS_PATH"; exit 1; }
          test -n "${{ secrets.VPS_SSH_KEY }}" || { echo "Missing secret VPS_SSH_KEY"; exit 1; }

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${VPS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "mkdir -p '${VPS_PATH}'"

      - name: Sync project to VPS
        run: |
          set -euo pipefail
          rsync -az \
            --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "backend/.venv" \
            --exclude "backend/__pycache__" \
            --exclude "frontend/.next" \
            --exclude "frontend/node_modules" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${VPS_PORT:-22}" \
            ./ "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/"

      - name: Deploy on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'
            docker compose up -d --build db
            docker compose run --rm -T --build backend alembic upgrade head
            docker compose up -d --build backend frontend
            docker compose ps
          "

      - name: Healthchecks on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'

            for i in \$(seq 1 60); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -sf http://127.0.0.1:8000/health

            for i in \$(seq 1 60); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
              if [ \"\$code\" = \"200\" ]; then
                break
              fi
              sleep 2
            done
            code=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ \"\$code\" = \"200\" ] || { echo \"Frontend healthcheck failed: \$code\"; exit 1; }
          "

      - name: Dump remote logs on failure
        if: failure()
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set +e
            cd '${VPS_PATH}'
            docker compose ps
            docker compose logs --tail=200 backend
            docker compose logs --tail=120 frontend
            docker compose logs --tail=120 db
          "
