name: Inspect Prod Studio Formulas

on:
  push:
    branches:
      - main
    paths:
      - "backend/scripts/inspect_prod_studio_formula_options.py"
      - ".github/workflows/inspect-prod-studio-formulas.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "${VPS_USER}" || { echo "Missing secret VPS_USER"; exit 1; }
          test -n "${VPS_PATH}" || { echo "Missing secret VPS_PATH"; exit 1; }
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing SSH key secret: set VPS_SSH_KEY (preferred) or SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY_CONTENT="${{ secrets.VPS_SSH_KEY }}"
          if [ -z "${SSH_KEY_CONTENT}" ]; then
            SSH_KEY_CONTENT="${{ secrets.SSH_PRIVATE_KEY }}"
          fi
          printf '%s\n' "${SSH_KEY_CONTENT}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keygen -R "${VPS_HOST}" >/dev/null 2>&1 || true
          ssh-keygen -R "[${VPS_HOST}]:${VPS_PORT:-22}" >/dev/null 2>&1 || true
          ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${VPS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${VPS_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts || {
            echo "known_hosts is empty. Configure VPS_KNOWN_HOSTS or ensure ssh-keyscan reaches the host."
            exit 1
          }
          chmod 644 ~/.ssh/known_hosts

      - name: Upload inspect script to VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            mkdir -p '${VPS_PATH}/backend/scripts'
          "
          scp -i ~/.ssh/id_ed25519 -P "${VPS_PORT:-22}" \
            backend/scripts/inspect_prod_studio_formula_options.py \
            "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/backend/scripts/inspect_prod_studio_formula_options.py"

      - name: Run inspect script on VPS
        run: |
          set -euo pipefail
          SUMMARY_FILE="$(mktemp)"
          EXIT_CODE=0
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -uo pipefail
            cd '${VPS_PATH}'
            export COMPOSE_PROJECT_NAME='piano-app'
            services=\$(docker compose config --services)
            if echo \"\$services\" | grep -qx redis; then
              docker compose up -d db redis backend
            else
              docker compose up -d db backend
            fi
            docker compose cp backend/scripts/inspect_prod_studio_formula_options.py backend:/app/scripts/inspect_prod_studio_formula_options.py
            docker compose exec -T backend python scripts/inspect_prod_studio_formula_options.py
          " >"${SUMMARY_FILE}" 2>&1 || EXIT_CODE=$?

          {
            echo "## Studio formula inspection"
            echo
            echo "- Exit code: ${EXIT_CODE}"
            echo
            echo '```text'
            cat "${SUMMARY_FILE}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          cat "${SUMMARY_FILE}"

          ENCODED_TAIL="$(tail -n 80 "${SUMMARY_FILE}" | python3 -c "import sys; data = sys.stdin.read(); data = data.replace('%', '%25').replace('\\r', '%0D').replace('\\n', '%0A'); print(data)")"
          if [ -n "${ENCODED_TAIL}" ]; then
            echo "::notice title=Studio formula inspect tail::${ENCODED_TAIL}"
          fi

          if [ "${EXIT_CODE}" -ne 0 ]; then
            if [ -n "${ENCODED_TAIL}" ]; then
              echo "::error title=Studio formula inspect failed::${ENCODED_TAIL}"
            fi
            echo "Inspection command failed with exit code ${EXIT_CODE}"
            exit 1
          fi
