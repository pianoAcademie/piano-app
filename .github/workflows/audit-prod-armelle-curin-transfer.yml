name: Audit Prod Armelle Curin Transfer

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the guarded transfer and create the complementary invoice
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}"
          test -n "${VPS_USER}"
          test -n "${VPS_PATH}"
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY_CONTENT="${{ secrets.VPS_SSH_KEY }}"
          if [ -z "${SSH_KEY_CONTENT}" ]; then SSH_KEY_CONTENT="${{ secrets.SSH_PRIVATE_KEY }}"; fi
          printf '%s\n' "${SSH_KEY_CONTENT}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${VPS_KNOWN_HOSTS}" ]; then printf '%s\n' "${VPS_KNOWN_HOSTS}" >> ~/.ssh/known_hosts; fi
          chmod 644 ~/.ssh/known_hosts
      - name: Audit or apply transfer on VPS
        run: |
          set -euo pipefail
          args=""
          if [ "${{ inputs.apply }}" = "true" ]; then args="--apply"; fi
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'
            export COMPOSE_PROJECT_NAME='piano-app'
            docker compose exec -T backend python - ${args}
          " < backend/scripts/move_prod_armelle_curin_to_thursday.py
      - name: Audit effective Armelle price
        if: ${{ !inputs.apply }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'
            export COMPOSE_PROJECT_NAME='piano-app'
            docker compose exec -T backend python -
          " < backend/scripts/audit_prod_armelle_curin_price.py
