name: Diagnose production authentication database

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Setup SSH
        env:
          PRIMARY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          FALLBACK_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh_key_content="${PRIMARY_SSH_KEY}"
          if [ -z "${ssh_key_content}" ]; then
            ssh_key_content="${FALLBACK_SSH_KEY}"
          fi
          printf '%s\n' "${ssh_key_content}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${VPS_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${VPS_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts

      - name: Inspect authentication schema and recent errors
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            cd '${VPS_PATH}'
            export COMPOSE_PROJECT_NAME='piano-app'

            echo '--- alembic revision ---'
            docker compose exec -T db psql -X -U piano -d piano_academie -v ON_ERROR_STOP=1 -c \
              \"SELECT version_num FROM alembic_version;\"

            echo '--- refresh-session table ---'
            docker compose exec -T db psql -X -U piano -d piano_academie -v ON_ERROR_STOP=1 -c \
              \"SELECT to_regclass('public.auth_refresh_sessions') AS relation;\"

            echo '--- refresh-session columns ---'
            docker compose exec -T db psql -X -U piano -d piano_academie -v ON_ERROR_STOP=1 -c \
              \"SELECT column_name, data_type, is_nullable FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'auth_refresh_sessions' ORDER BY ordinal_position;\"

            echo '--- recent authentication database errors ---'
            docker compose logs --since=2h --no-color backend 2>&1 | \
              grep -E -A18 -B5 'ProgrammingError|auth_refresh_sessions|Unable to record login' | tail -n 240 || true
          "
