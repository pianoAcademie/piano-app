name: Audit Prod Bar Trial Slots
on: workflow_dispatch
env: {FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"}
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ~/.ssh; chmod 700 ~/.ssh; key="${{ secrets.VPS_SSH_KEY }}"; if [ -z "$key" ];then key="${{ secrets.SSH_PRIVATE_KEY }}";fi
          printf '%s\n' "$key"|tr -d '\r'>~/.ssh/id_ed25519;chmod 600 ~/.ssh/id_ed25519;:>~/.ssh/known_hosts;ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST">>~/.ssh/known_hosts 2>/dev/null||true
          if [ -n "$VPS_KNOWN_HOSTS" ];then printf '%s\n' "$VPS_KNOWN_HOSTS">>~/.ssh/known_hosts;fi
      - run: ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "cd '$VPS_PATH' && COMPOSE_PROJECT_NAME=piano-app docker compose exec -T backend python -" < backend/scripts/audit_prod_bar_trial_slots_autumn_2026.py
