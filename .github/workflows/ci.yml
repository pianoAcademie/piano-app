name: CI

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Alembic revision chain
        run: python3 backend/scripts/check_alembic_chain.py

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait backend healthy
        run: |
          for i in {1..60}; do
            CID=$(docker compose ps -q backend)
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID")
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend --tail=200
          exit 1

      - name: Run backend smoke test
        run: docker compose exec -T backend python scripts/smoke_v1.py

      - name: Check frontend endpoints
        run: |
          docker compose exec -T frontend node -e "fetch('http://localhost:3000/login').then(async r=>{const t=await r.text(); if(r.status!==200||!t.includes('Piano Academie')) process.exit(1);}).catch(()=>process.exit(1));"
          docker compose exec -T frontend node -e "fetch('http://localhost:3000/dashboard',{redirect:'manual'}).then(r=>{const loc=r.headers.get('location')||''; if(r.status!==307||!loc.includes('/login')) process.exit(1);}).catch(()=>process.exit(1));"

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose logs backend --tail=300
          docker compose logs frontend --tail=300

      - name: Teardown
        if: always()
        run: docker compose down -v
